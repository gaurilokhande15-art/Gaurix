<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CROP LAND - Farmer Registration</title>

    <link rel="stylesheet" href="css/style1.css">

</head>

<body>

    <header>

        <div class="logo">
            🌾 CROP LAND
        </div>

        <nav>
            <a href="farmaland.html">Home</a>
            <a href="registration.html">Back</a>
        </nav>

    </header>


    <main class="registration">

        <h1>Farmer Registration</h1>

        <p>Create your CropLand farmer account</p>


        <form class="registration-form" id="farmerRegistrationForm">

            <label>Full Name</label>

            <input type="text"
            id="farmerFullName"
                   placeholder="Enter your full name"
                   required>


            <label>Mobile Number</label>

            <input type="tel"
            id="farmerPhone"
                   placeholder="Enter mobile number"
                   required>


            <label>Email</label>

            <input type="email"
            id="farmerEmail"
                   placeholder="Enter email address"
                   required>


            <label>Farm Location</label>

            <input type="text"
            id="farmerLocation"
                   placeholder="Village, District, State"
                   required>


            <label>Farm Size</label>

            <input type="text"
            id="farmerFarmSize"
                   placeholder="Example: 5 acres">


            <label>Password</label>

            <input type="password"
            id="farmerPassword"
                   placeholder="Create a password"
                   required>


            <button type="submit">
    Create Farmer Account
</button>

        </form>

        <p class="login-link">
    Already have an account?
    <a href="farmer-login.html">Login here</a>
</p>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase.js"></script>

    <script>
document.getElementById("farmerRegistrationForm").addEventListener("submit", async function(event) {
    event.preventDefault();

    const fullName = document.getElementById("farmerFullName").value.trim();
    const phone = document.getElementById("farmerPhone").value.trim();
    const email = document.getElementById("farmerEmail").value.trim();
    const location = document.getElementById("farmerLocation").value.trim();
    const farmSize = document.getElementById("farmerFarmSize").value.trim();
    const password = document.getElementById("farmerPassword").value;

    const { data, error } = await supabaseClient.auth.signUp({
        email: email,
        password: password,
        options: {
            data: {
                full_name: fullName,
                phone: phone,
                role: "Farmer",
                farm_location: location,
                farm_size: farmSize
            }
        }
    });

  if (error) {
    if (
        error.message.toLowerCase().includes("already registered") ||
        error.message.toLowerCase().includes("already exists")
    ) {
        alert("This email is already registered. Please login.");
        window.location.href = "farmer-login.html";
        return;
    }

    alert("Registration failed: " + error.message);
    return;
}
if (!data || !data.user) {
    alert("Registration did not complete. Please try again.");
    return;
}

alert("Account created successfully! Please check your email for confirmation.");

window.location.href = "farmer-dashboard.html";  
});
</script>
</body>

</html>
