<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Farmer Login - Cropland</title>
    <link rel="stylesheet" href="css/style1.css">
</head>
<body>

    <h1>Farmer Login</h1>

    
    <div class="registration-container">
    <div class="registration-box">

        <h1>Farmer Login</h1>
        <p class="form-subtitle">Login to your Cropland account</p>

        <form id="farmerLoginForm">

            <div class="form-group">
                <label for="farmerLoginEmail">Email</label>
                <input
                    type="email"
                    id="farmerLoginEmail"
                    placeholder="Enter your email"
                    required
                >
            </div>

            <div class="form-group">
                <label for="farmerLoginPassword">Password</label>
                <input
                    type="password"
                    id="farmerLoginPassword"
                    placeholder="Enter your password"
                    required
                >
            </div>

            <button type="submit" class="register-btn">
                Login
            </button>

        </form>

        <p class="login-link">
            Don't have an account?
            <a href="farmer-registration.html">Register here</a>
        </p>

    </div>
</div>

    <p>
        Don't have an account?
        <a href="farmer-registration.html">Register here</a>
    </p>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase.js"></script>

    <script>
        document.getElementById("farmerLoginForm").addEventListener("submit", async function(event) {
            event.preventDefault();

            const email = document.getElementById("farmerLoginEmail").value.trim();
            const password = document.getElementById("farmerLoginPassword").value;

            const { data, error } = await supabaseClient.auth.signInWithPassword({
                email: email,
                password: password
            });

            if (error) {
                alert("Login failed: " + error.message);
                return;
            }

            window.location.href = "farmer-dashboard.html";
        });
    </script>

</body>
</html>
