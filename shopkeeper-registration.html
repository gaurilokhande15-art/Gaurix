<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>CROP LAND - Shopkeeper Registration</title>

    <link rel="stylesheet" href="css/style1.css">

</head>

<body>

    <header>

        <div class="logo">
            🌾 CROP LAND
        </div>

        <nav>
            <a href="farmaland.html">Home</a>
            <a href="registration.html">Back</a>
        </nav>

    </header>


    <main class="registration">

        <h1>Shopkeeper Registration</h1>

        <p>Create your CropLand shopkeeper account</p>


        <form class="registration-form" id="shopkeeperRegistrationForm">

            <label>Shop Name</label>

            <input type="text"
                   placeholder="Enter shop name"
                   required>


            <label>Owner Name</label>

            <input type="text"
                   placeholder="Enter owner name"
                   required>


            <label>Mobile Number</label>

            <input type="tel"
                   placeholder="Enter mobile number"
                   required>


            <label>Email</label>

            <input type="email"
                   placeholder="Enter email address">


            <label>Shop Location</label>

            <input type="text"
                   placeholder="City, District, State"
                   required>


            <label>Business Type</label>

            <input type="text"
                   placeholder="Example: Grocery Store">


            <label>Password</label>

            <input type="password"
                   placeholder="Create a password"
                   required>


            <button type="submit">
                Create Shopkeeper Account
            </button>

        </form>
<p class="login-link">
    Already have an account?
    <a href="shopkeeper-login.html">Login here</a>
</p>
    </main>
<script src="js/script.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
</body>

</html>
